<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emolog — interactive playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0b0b0c; }
  body {
    color: #ece9e3;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  #app { width: 960px; max-width: 100%; }
  a { color: #d9c98f; text-decoration: none; }
  a:hover { color: #eddca8; }
  button { font-family: inherit; }

  @keyframes eg-ring { 0% { transform: scale(0.3); opacity: .9; } 100% { transform: scale(1.4); opacity: 0; } }
</style>
</head>
<body>
<div id="app"></div>

<script src="./data.js"></script>
<script>
(function () {
  const DATA = window.EMOLOG_DATA || { presets: [], benchmark: [], meanLift: 0 };
  const PRESETS = DATA.presets;
  const ACCENT = '#d9c98f';

  // -- tiny DOM helper: el(tag, {attrs/style}, ...children) --
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const k in attrs) {
      if (k === 'style') n.style.cssText = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k.startsWith('on') && typeof attrs[k] === 'function') n[k.toLowerCase()] = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    for (const kid of kids) if (kid != null) n.append(kid);
    return n;
  };

  const CARD = 'border-radius:10px;padding:18px 20px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);';

  let sel = 0, stage = 3, timers = [];
  const refs = {};

  // ---------------------------------------------------------------- HERO
  function hero() {
    // diagonal light-ray texture over a near-black radial spotlight
    const bg = el('div', { style:
      'position:relative;overflow:hidden;' +
      'background:radial-gradient(ellipse 700px 500px at 50% 0%, #232327 0%, #0b0b0c 60%);' +
      'border-bottom:1px solid rgba(255,255,255,.08)' });
    bg.append(el('div', { style:
      'position:absolute;inset:0;pointer-events:none;' +
      'background:repeating-linear-gradient(100deg, transparent 0 40px, rgba(255,255,255,.025) 40px 41px)' }));

    // top row: headline + install pill (left), benchmarks badge (right)
    const left = el('div', { style: 'max-width:480px' },
      el('div', { style: "font:500 34px/1.25 'Playfair Display',serif;font-style:italic", html: 'emotional memory<br>for voice agents' }),
      el('div', { style: "margin-top:18px;font:400 13px/1.6 'JetBrains Mono',monospace;color:rgba(236,233,227,.55);max-width:380px",
        text: "transcripts throw away tone the moment they're written. emolog reads it straight from the audio." }),
      el('div', { style: 'margin-top:22px;display:flex;gap:12px;align-items:center' },
        el('span', { style: "font:500 12px 'JetBrains Mono',monospace;padding:10px 16px;border-radius:7px;background:#ece9e3;color:#0b0b0c", text: 'pip install emologcontext' })));

    const badge = el('div', { style:
      'background:linear-gradient(135deg,#3a6e73,#2b5458);border-radius:14px;padding:14px 18px;' +
      'display:flex;align-items:center;gap:14px;max-width:300px' },
      el('div', {}, el('div', { style: "font:500 15px 'Playfair Display',serif;font-style:italic;color:#fff", text: 'emolog benchmarks' })),
      el('a', { href: '#benchmark', style:
        "flex:none;font:500 11px 'Inter',sans-serif;color:#fff;border:1px solid rgba(255,255,255,.5);" +
        'border-radius:20px;padding:6px 12px;white-space:nowrap', text: 'view results' }));

    bg.append(el('div', { style:
      'position:relative;padding:44px 40px 0;display:flex;justify-content:space-between;' +
      'align-items:flex-start;gap:20px;flex-wrap:wrap' }, left, badge));

    // center: metallic device card with the sonar-ring "listening" screen
    const screen = el('div', { style:
      'position:relative;width:100%;height:110px;border-radius:12px;overflow:hidden;background:#000;' +
      'display:flex;align-items:center;justify-content:center' },
      el('div', { style: 'width:8px;height:8px;border-radius:50%;background:#ece9e3;position:relative;z-index:2' }));
    [0, 1, 2, 3].forEach(i => screen.append(el('div', { style:
      'position:absolute;width:90px;height:90px;border-radius:50%;border:1.5px solid #ece9e3;' +
      'animation:eg-ring 2.6s ease-out ' + (i * 0.65) + 's infinite' })));
    screen.append(el('div', { style:
      "position:absolute;left:10px;bottom:8px;font:500 10px 'JetBrains Mono',monospace;" +
      'color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.05em', text: 'pip install emologcontext' }));

    const device = el('div', { style: 'position:relative;z-index:2;width:340px' },
      el('div', { style:
        'position:absolute;top:-26px;left:50%;transform:translateX(-50%) rotate(-4deg);' +
        "background:#1c1d1f;color:rgba(236,233,227,.7);font:500 10px 'Inter',sans-serif;" +
        'text-transform:uppercase;letter-spacing:.08em;padding:8px 14px;border-radius:2px;' +
        'box-shadow:0 6px 14px rgba(0,0,0,.4)', text: 'built for voice agents' }),
      el('div', { style:
        'background:linear-gradient(155deg,#eceae4,#b9b6ae 60%,#8d8a83);border-radius:22px;padding:16px;' +
        'box-shadow:0 20px 50px rgba(0,0,0,.55)' }, screen));

    bg.append(el('div', { style: 'position:relative;margin-top:36px;display:flex;justify-content:center' }, device));

    // giant cropped wordmark
    bg.append(el('div', { style: 'margin-top:8px;width:100%;overflow:hidden;line-height:0.78' },
      el('div', { style:
        "font:700 260px 'Playfair Display',serif;font-style:italic;color:#fff;" +
        'white-space:nowrap;text-align:center;transform:scaleX(1.05)', text: 'emolog' })));

    return bg;
  }

  // ---------------------------------------------------------- PLAYGROUND
  function playground() {
    const wrap = el('div');

    // heading + preset picker
    wrap.append(el('div', { style: 'padding:64px 40px 24px' },
      el('div', { style: "font:500 26px/1.4 'Space Grotesk',sans-serif;max-width:600px",
        text: 'pick a line. watch what your agent would have missed.' }),
      (refs.pickRow = el('div', { style: 'margin-top:24px;display:flex;gap:10px;flex-wrap:wrap' }))));

    refs.buttons = PRESETS.map((p, i) => {
      const b = el('button', {
        style: buttonStyle(i === sel),
        text: p.tag,
        onClick: () => selectPreset(i)
      });
      b.onmouseenter = () => { if (i !== sel) { b.style.borderColor = ACCENT; b.style.color = ACCENT; } };
      b.onmouseleave = () => { if (i !== sel) { b.style.borderColor = 'rgba(255,255,255,.14)'; b.style.color = 'rgba(236,233,227,.6)'; } };
      refs.pickRow.append(b);
      return b;
    });

    // transcript card
    wrap.append(el('div', { style: 'padding:24px 40px 0' },
      (refs.transcript = el('div', { style: "font:500 22px/1.4 'Space Grotesk',sans-serif;padding:22px 24px;" + CARD }))));

    // 3-column pipeline
    const pipeCard = (labelText, big) => {
      const card = el('div', { style: CARD });
      card.append(el('div', { style: "font:500 13px 'Inter',sans-serif;color:rgba(236,233,227,.45);margin-bottom:10px", text: labelText }));
      const val = el('div', { style: "font:700 " + (big ? '24px' : '20px') + " 'Space Grotesk',sans-serif;transition:color .4s ease" });
      card.append(val);
      return { card, val };
    };
    const arrow = () => el('div', { style: "align-self:center;font:26px 'Inter',sans-serif;opacity:.15", text: '→' });

    const emo = pipeCard('emotion detected', true);
    const arc = pipeCard('conversation arc', false);
    const tts = pipeCard('voice becomes', false);
    refs.emotionCard = emo.card; refs.emotionVal = emo.val;
    refs.trackerCard = arc.card; refs.convoVal = arc.val;
    refs.outputCard = tts.card;  refs.ttsVal = tts.val;

    wrap.append(el('div', { style:
      'padding:36px 40px 8px;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch' },
      emo.card, arrow(), arc.card, arrow(), tts.card));

    // injected system prompt
    refs.contextSpan = el('span', { style: 'transition:color .4s ease' });
    refs.promptCard = el('div', { style:
      "font:13px/1.7 'JetBrains Mono',monospace;background:rgba(255,255,255,.03);border-radius:10px;" +
      'padding:18px 20px;white-space:pre-wrap;border:1px solid rgba(255,255,255,.08)' });
    refs.promptCard.append(document.createTextNode('system: "You are a helpful voice assistant."\n'), refs.contextSpan);
    wrap.append(el('div', { style: 'padding:20px 40px 0' }, refs.promptCard));

    return wrap;
  }

  function buttonStyle(active) {
    return "font:400 14px 'Inter',sans-serif;padding:10px 18px;border-radius:8px;cursor:pointer;transition:all .2s ease;" +
      'border:1px solid ' + (active ? ACCENT : 'rgba(255,255,255,.14)') + ';' +
      'background:' + (active ? 'rgba(217,201,143,.1)' : 'transparent') + ';' +
      'color:' + (active ? ACCENT : 'rgba(236,233,227,.6)') + ';';
  }

  // ------------------------------------------------------- BEFORE/AFTER
  function comparison() {
    const wrap = el('div');
    wrap.append(el('div', { style: 'padding:56px 40px 8px' },
      el('div', { style: "font:500 26px/1.4 'Space Grotesk',sans-serif;max-width:600px",
        text: 'the same agent, hearing what you heard.' })));

    refs.baselineReply = el('div', { style: "font:400 17px/1.55 'Inter',sans-serif;color:rgba(236,233,227,.65)" });
    refs.awareReply = el('div', { style: "font:500 17px/1.55 'Inter',sans-serif" });
    refs.awareLabel = el('div', { style: "font:500 13px 'Inter',sans-serif;margin-bottom:12px;transition:color .4s ease", text: 'with emolog' });

    wrap.append(el('div', { style:
      'padding:24px 40px 80px;display:grid;grid-template-columns:1fr 1fr;gap:1px;' +
      'background:rgba(255,255,255,.08);border-radius:14px;overflow:hidden' },
      el('div', { style: 'background:#0b0b0c;padding:24px 26px' },
        el('div', { style: "font:500 13px 'Inter',sans-serif;color:rgba(236,233,227,.4);margin-bottom:12px", text: 'without emolog' }),
        refs.baselineReply),
      el('div', { style: 'background:#0b0b0c;padding:24px 26px' }, refs.awareLabel, refs.awareReply)));
    return wrap;
  }

  // ----------------------------------------------------------- BENCHMARK
  function benchmark() {
    const wrap = el('div', { id: 'benchmark', style: 'padding:24px 40px 56px;border-top:1px solid rgba(255,255,255,.08)' });
    wrap.append(el('div', { style: "font:500 20px 'Space Grotesk',sans-serif;margin-bottom:24px",
      text: 'how it holds up against a baseline agent' }));

    (DATA.benchmark || []).forEach(d => {
      const track = el('div', { style: 'height:6px;border-radius:4px;background:rgba(255,255,255,.08);position:relative;overflow:hidden' },
        el('div', { style: 'position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:rgba(255,255,255,.18);width:' + (d.baseline * 100) + '%' }),
        el('div', { style: 'position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:' + ACCENT + ';width:' + (d.emolog * 100) + '%' }));
      wrap.append(el('div', { style: 'margin-bottom:18px' },
        el('div', { style:
          "display:flex;justify-content:space-between;font:400 14px 'Inter',sans-serif;color:rgba(236,233,227,.6);margin-bottom:8px" },
          el('span', { text: d.name }),
          el('span', { style: 'color:' + ACCENT, text: Math.round(d.emolog * 100) + '%' })),
        track));
    });
    return wrap;
  }

  // -------------------------------------------------------------- FOOTER
  function footer() {
    return el('div', { style:
      'padding:40px 40px 48px;border-top:1px solid rgba(255,255,255,.08);' +
      'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px' },
      el('span', { style: "font:500 13px 'JetBrains Mono',monospace;padding:11px 18px;border-radius:8px;background:#d9c98f;color:#0b0b0c", text: 'pip install emologcontext' }),
      el('span', { style: "font:400 13px 'Inter',sans-serif;color:rgba(236,233,227,.4)", text: 'MIT License' }));
  }

  // ---------------------------------------------------- STATE / REVEAL
  function setContent(p) {
    refs.buttons.forEach((b, i) => { b.style.cssText = buttonStyle(i === sel); });
    refs.transcript.textContent = '"' + p.transcript + '"';
    refs.emotionVal.textContent = p.emotion;
    refs.convoVal.textContent = p.convoMood;
    refs.ttsVal.textContent = p.tts.style;
    refs.contextSpan.textContent = p.contextString;
    refs.baselineReply.textContent = p.baselineReply;
    refs.awareReply.textContent = p.awareReply;
  }

  function applyStage() {
    const reveal = (card, on) => {
      card.style.opacity = on ? '1' : '0.4';
      card.style.transform = on ? 'translateY(0)' : 'translateY(4px)';
      card.style.transition = 'all .4s cubic-bezier(.2,.7,.3,1)';
    };
    reveal(refs.emotionCard, stage >= 1);
    reveal(refs.trackerCard, stage >= 2);
    reveal(refs.outputCard, stage >= 3);
    refs.emotionVal.style.color = stage >= 1 ? ACCENT : '#ece9e3';
    refs.convoVal.style.color   = stage >= 2 ? ACCENT : '#ece9e3';
    refs.ttsVal.style.color     = stage >= 3 ? ACCENT : '#ece9e3';
    refs.contextSpan.style.color = stage >= 3 ? ACCENT : 'rgba(236,233,227,.35)';
    refs.awareLabel.style.color  = stage >= 3 ? ACCENT : 'rgba(236,233,227,.4)';
  }

  function selectPreset(i) {
    timers.forEach(clearTimeout); timers = [];
    sel = i; stage = 0;
    setContent(PRESETS[i]);
    applyStage();
    timers.push(setTimeout(() => { stage = 1; applyStage(); }, 150));
    timers.push(setTimeout(() => { stage = 2; applyStage(); }, 600));
    timers.push(setTimeout(() => { stage = 3; applyStage(); }, 1050));
  }

  // --------------------------------------------------------------- BUILD
  const app = document.getElementById('app');
  app.append(hero(), playground(), comparison(), benchmark(), footer());

  if (PRESETS.length) {
    sel = 0; stage = 3;              // first preset shown fully resolved
    setContent(PRESETS[0]);
    applyStage();
  }
})();
</script>
</body>
</html>
