[project]
name = "emologcontext"
version = "0.1.0"
description = "The missing emotional memory layer for voice agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rish" }]
keywords = ["voice-ai", "emotion", "paralinguistics", "tts", "llm", "voice-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/rishabhsabnavis/emolog"
Repository = "https://github.com/rishabhsabnavis/emolog"
Issues = "https://github.com/rishabhsabnavis/emolog/issues"

[project.optional-dependencies]
full    = ["torch>=2.0", "torchaudio>=2.0", "transformers>=4.35"]
whisper = ["openai-whisper>=20231117"]
dev     = ["pytest>=7", "emologcontext[full]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emologcontext"]

[tool.hatch.build.targets.sdist]
# The playground's logo asset is a 2.2 MB PNG that the current page no longer
# references (it renders the wordmark as CSS text). Shipping it made the sdist
# ~50x larger than the code it wraps.
exclude = ["playground/assets"]
